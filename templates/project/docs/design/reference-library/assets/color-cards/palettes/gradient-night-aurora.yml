schema_version: 1
id: gradient-night-aurora
title: '渐变：夜幕极光'
source_image: ../images/gradient-night-aurora.png
colors:
- role: primary
  name: '主色'
  hex: '#07100C'
  usage: '深色锚点、主文字、主导航或暗色画布'
- role: secondary
  name: '次色'
  hex: '#193329'
  usage: '主行动、链接、模块重点或主要结构'
- role: accent
  name: '强调色'
  hex: '#8ED8B8'
  usage: '状态、编号、局部高亮或视觉记忆点'
- role: soft_background
  name: '柔和背景'
  hex: '#869E93'
  usage: '卡片浅底、次级文字、边界或低优先级分区'
- role: page_background
  name: '页面背景'
  hex: '#F3F0E8'
  usage: '页面留白、主要阅读底或高对比文字'

gradient_specs:
  ambient: 'radial-gradient(circle at 10% -4%, rgba(92, 214, 159, 0.22), transparent 31%), radial-gradient(circle at 88% 26%, rgba(46, 124, 138, 0.18), transparent 33%), linear-gradient(145deg, #07100C 0%, #0B1511 50%, #080D0B 100%)'
  panel_ambient: 'linear-gradient(145deg, rgba(142, 216, 184, 0.055), transparent 46%, rgba(46, 124, 138, 0.06))'
token_suggestions:
  color.primary: primary
  color.secondary: secondary
  color.accent: accent
  color.surface.tint: soft_background
  color.background: page_background
token_hint: '正文区域保持近黑纯色，极光只在边缘发生，面板使用极轻玻璃渐变。'
accessibility_notes:
- '低风险：正式实现仍需验证小字、细线、按钮和半透明面板对比度。'
- '渐变只能承担环境光，正文与交互控件必须落在稳定色面上。'

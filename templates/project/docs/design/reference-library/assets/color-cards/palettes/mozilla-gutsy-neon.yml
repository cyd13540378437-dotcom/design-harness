schema_version: 1
id: mozilla-gutsy-neon
title: '黑白霓虹宣言'
source_image: ../images/mozilla-gutsy-neon.png
colors:
- role: primary
  name: '主色'
  hex: '#000000'
  usage: '深色锚点、主文字、主导航或暗色画布'
- role: secondary
  name: '次色'
  hex: '#6E008B'
  usage: '主行动、链接、模块重点或主要结构'
- role: accent
  name: '强调色'
  hex: '#54FFBD'
  usage: '状态、编号、局部高亮或视觉记忆点'
- role: soft_background
  name: '柔和背景'
  hex: '#FFF44F'
  usage: '卡片浅底、次级文字、边界或低优先级分区'
- role: page_background
  name: '页面背景'
  hex: '#FFFFFF'
  usage: '页面留白、主要阅读底或高对比文字'
token_suggestions:
  color.primary: primary
  color.secondary: secondary
  color.accent: accent
  color.surface.tint: soft_background
  color.background: page_background
token_hint: '黑白占据主要阅读区域，深紫建立纵深，霓虹绿和柠檬黄严格限制在关键块。'
accessibility_notes:
- '高风险：正式实现仍需验证小字、细线、按钮和半透明面板对比度。'
- '彩色面积越大，越需要控制饱和度并保持清晰的文字层级。'

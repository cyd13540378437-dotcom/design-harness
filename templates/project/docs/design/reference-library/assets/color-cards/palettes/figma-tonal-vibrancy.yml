schema_version: 1
id: figma-tonal-vibrancy
title: '色相振动实验'
source_image: ../images/figma-tonal-vibrancy.png
colors:
- role: primary
  name: '主色'
  hex: '#26133A'
  usage: '深色锚点、主文字、主导航或暗色画布'
- role: secondary
  name: '次色'
  hex: '#7157D9'
  usage: '主行动、链接、模块重点或主要结构'
- role: accent
  name: '强调色'
  hex: '#35A36F'
  usage: '状态、编号、局部高亮或视觉记忆点'
- role: soft_background
  name: '柔和背景'
  hex: '#D7C84A'
  usage: '卡片浅底、次级文字、边界或低优先级分区'
- role: page_background
  name: '页面背景'
  hex: '#F5F0FA'
  usage: '页面留白、主要阅读底或高对比文字'
token_suggestions:
  color.primary: primary
  color.secondary: secondary
  color.accent: accent
  color.surface.tint: soft_background
  color.background: page_background
token_hint: '紫与绿形成主张，芥末黄作为第三节拍；大面积使用时必须保持结构清晰。'
accessibility_notes:
- '高风险：正式实现仍需验证小字、细线、按钮和半透明面板对比度。'
- '彩色面积越大，越需要控制饱和度并保持清晰的文字层级。'

schema_version: 1
id: blueprint-archive
title: '蓝晒档案'
source_image: ../images/blueprint-archive.png
colors:
- role: primary
  name: '主色'
  hex: '#161B20'
  usage: '深色锚点、主文字、主导航或暗色画布'
- role: secondary
  name: '次色'
  hex: '#1F4B6E'
  usage: '主行动、链接、模块重点或主要结构'
- role: accent
  name: '强调色'
  hex: '#B3533D'
  usage: '状态、编号、局部高亮或视觉记忆点'
- role: soft_background
  name: '柔和背景'
  hex: '#D9D6CD'
  usage: '卡片浅底、次级文字、边界或低优先级分区'
- role: page_background
  name: '页面背景'
  hex: '#F3F0E8'
  usage: '页面留白、主要阅读底或高对比文字'

gradient_specs:
  ambient: 'linear-gradient(rgba(22, 27, 32, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(22, 27, 32, 0.025) 1px, transparent 1px), radial-gradient(circle at 16% 0%, rgba(31, 75, 110, 0.14), transparent 34rem), radial-gradient(circle at 88% 14%, rgba(179, 83, 61, 0.08), transparent 30rem), radial-gradient(circle at 55% 100%, rgba(142, 118, 61, 0.08), transparent 34rem), #D9D6CD'
  panel_ambient: 'linear-gradient(145deg, rgba(251, 248, 241, 0.74), rgba(232, 228, 218, 0.54))'
token_suggestions:
  color.primary: primary
  color.secondary: secondary
  color.accent: accent
  color.surface.tint: soft_background
  color.background: page_background
token_hint: '纸白承担长内容，普鲁士蓝建立导航与章节秩序，朱砂只用于关键判断和证据。'
accessibility_notes:
- '低风险：正式实现仍需验证小字、细线、按钮和半透明面板对比度。'
- '渐变只能承担环境光，正文与交互控件必须落在稳定色面上。'

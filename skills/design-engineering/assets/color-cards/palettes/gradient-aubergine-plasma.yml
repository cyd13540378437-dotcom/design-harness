schema_version: 1
id: gradient-aubergine-plasma
title: '渐变：茄紫等离子'
source_image: ../images/gradient-aubergine-plasma.png
colors:
- role: primary
  name: '主色'
  hex: '#130B14'
  usage: '深色锚点、主文字、主导航或暗色画布'
- role: secondary
  name: '次色'
  hex: '#37203A'
  usage: '主行动、链接、模块重点或主要结构'
- role: accent
  name: '强调色'
  hex: '#C08ACF'
  usage: '状态、编号、局部高亮或视觉记忆点'
- role: soft_background
  name: '柔和背景'
  hex: '#B98A78'
  usage: '卡片浅底、次级文字、边界或低优先级分区'
- role: page_background
  name: '页面背景'
  hex: '#F8F1F4'
  usage: '页面留白、主要阅读底或高对比文字'

gradient_specs:
  ambient: 'radial-gradient(circle at 4% 12%, rgba(150, 64, 114, 0.27), transparent 32%), radial-gradient(circle at 82% 4%, rgba(102, 77, 168, 0.24), transparent 30%), linear-gradient(150deg, #100912 0%, #1B0E1C 48%, #0B0A10 100%)'
  panel_ambient: 'linear-gradient(150deg, rgba(192, 138, 207, 0.075), transparent 50%, rgba(185, 138, 120, 0.045))'
token_suggestions:
  color.primary: primary
  color.secondary: secondary
  color.accent: accent
  color.surface.tint: soft_background
  color.background: page_background
token_hint: '渐变集中在画布边缘，不让紫色进入长段正文。'
accessibility_notes:
- '中风险：正式实现仍需验证小字、细线、按钮和半透明面板对比度。'
- '渐变只能承担环境光，正文与交互控件必须落在稳定色面上。'
